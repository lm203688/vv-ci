name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: typecheck activity kit usage
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd /tmp && rm -rf at && mkdir at && cd at
          cp "$GITHUB_WORKSPACE/modules/vv-shared/ios/ServiceActivityAttributes.swift" .
          cat > use.swift <<'SW'
          import ActivityKit
          @available(iOS 16.1, *)
          func probeStart(_ car: String) async -> Bool {
            for activity in Activity<ServiceActivityAttributes>.activities {
              await activity.end(nil, dismissalPolicy: .immediate)
            }
            let attributes = ServiceActivityAttributes(car: car)
            let state = ServiceActivityAttributes.ContentState(headline: "h", detail: "d", days: 1)
            do {
              _ = try Activity.request(
                attributes: attributes,
                content: ActivityContent(state: state, staleDate: nil)
              )
              return true
            } catch {
              return false
            }
          }
          SW
          echo "--- pod target ios15.1"
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.1 ServiceActivityAttributes.swift 2>&1 | head -20
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.1 ServiceActivityAttributes.swift use.swift 2>&1 | head -25
          echo "--- ios26"
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios26.0 ServiceActivityAttributes.swift use.swift 2>&1 | head -25
