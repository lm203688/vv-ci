name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.VV_BUNDLE_ID }}
  WIDGET_BUNDLE_ID: ${{ vars.VV_WIDGET_BUNDLE_ID }}
  WATCH_BUNDLE_ID: ${{ vars.VV_WATCH_BUNDLE_ID }}
  TEAM_ID: ${{ vars.VV_TEAM_ID }}

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          sw_vers

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          set -x
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p vvpass build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p vvpass build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k vvpass build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profiles
        env:
          PROFILE_MAIN_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          PROFILE_MAIN_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
          PROFILE_WIDGET_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          PROFILE_WIDGET_UUID: ${{ secrets.PROFILE_WIDGET_UUID }}
          PROFILE_WATCH_B64: ${{ secrets.PROFILE_WATCH_B64 }}
          PROFILE_WATCH_UUID: ${{ secrets.PROFILE_WATCH_UUID }}
          WATCH_PROFILE_SPEC: ${{ vars.VV_WATCH_PROFILE }}
        run: |
          set -x
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_MAIN_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_MAIN_UUID.mobileprovision"
          printf '%s' "$PROFILE_WIDGET_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_WIDGET_UUID.mobileprovision"
          printf '%s' "$PROFILE_WATCH_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_WATCH_UUID.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Prebuild iOS project
        env:
          VV_PROFILE_MAIN: ${{ secrets.PROFILE_MAIN_UUID }}
          VV_PROFILE_WIDGET: ${{ secrets.PROFILE_WIDGET_UUID }}
          VV_PROFILE_WATCH: ${{ vars.VV_WATCH_PROFILE }}
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Guard app icon has no alpha (ITMS-90717)
        run: python3 .github/scripts/check_icon_alpha.py

      - name: Check target signing settings
        run: |
          grep -o 'PROVISIONING_PROFILE_SPECIFIER = [^;]*' ios/*.xcodeproj/project.pbxproj || true

      - name: Inspect installed provisioning profiles
        run: |
          set -x
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            echo "### $f"
            security cms -D -i "$f" 2>/dev/null | plutil -p - 2>/dev/null | grep -E '"Name"|"UUID"|"Platform|"TeamIdentifier|application-identifier|-groups' -A2 | head -20
          done
          security find-identity -v -p codesigning build.keychain || true

      - name: Add the watch target to the scheme BuildAction
        run: python3 .github/scripts/patch_watch_scheme.py

      - name: Archive
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/vv.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -60

      - name: Build and embed the watch app
        run: |
          set -euo pipefail
          SRC="ios/VehicleVaultWatch"
          OUT="$RUNNER_TEMP/watchprod"
          APP="$OUT/VehicleVaultWatch.app"
          mkdir -p "$APP"
          SDKPATH=$(xcrun --sdk watchos --show-sdk-path)
          for T in arm64_32 arm64; do
            xcrun --sdk watchos swiftc -parse-as-library -O \
              -target ${T}-apple-watchos11.0 -sdk "$SDKPATH" \
              -o "$OUT/bin-$T" "$SRC/VehicleVaultWatchApp.swift"
          done
          lipo -create -output "$APP/VehicleVaultWatch" "$OUT/bin-arm64_32" "$OUT/bin-arm64"
          lipo -info "$APP/VehicleVaultWatch"

          # watchOS 的 app icon 必须来自资源目录，且 altool 会逐档校验（缺 24/27.5/29/40/44/50/86/98/108 都拒）。
          ICONSET="$OUT/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 assets/icon.png --out "$OUT/icon-rgba.png" >/dev/null
          sips -s format jpeg "$OUT/icon-rgba.png" --out "$OUT/icon.jpg" >/dev/null
          sips -s format png "$OUT/icon.jpg" --out "$OUT/icon-base.png" >/dev/null
          python3 .github/scripts/make_watch_icons.py "$OUT/icon-base.png" "$ICONSET"
          xcrun actool --platform watchos --minimum-deployment-target 11.0 \
            --app-icon AppIcon --output-partial-info-plist "$OUT/watch-partial.plist" \
            --compile "$APP" "$OUT/Assets.xcassets" \
            --errors --warnings
          ls -l "$APP"

          python3 .github/scripts/make_watch_bundle.py "$SRC" "$APP" "$WATCH_BUNDLE_ID" \
            "$(node -p "require('./app.json').version")" \
            "$(node -p "require('./app.json').ios.buildNumber")" \
            "$(xcrun --sdk watchos --show-sdk-version)"
          cat "$OUT/watch-partial.plist" | head -30 || true

          codesign --force --sign "Apple Distribution" --keychain build.keychain \
            --identifier "$WATCH_BUNDLE_ID" "$APP"
          codesign -dv "$APP" 2>&1 | grep -Ei 'Identifier|TeamIdentifier' || true
          HOST=$(find "$RUNNER_TEMP/vv.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "host app: $HOST"
          mkdir -p "$HOST/Watch"
          ditto "$APP" "$HOST/Watch/VehicleVaultWatch.app"
          ls -l "$HOST/Watch/VehicleVaultWatch.app"

      - name: Archive diagnostics (watch)
        if: failure()
        run: |
          grep -a -n -E 'VehicleVaultWatch|Skipping|Embed Watch|error:' "$RUNNER_TEMP/archive.log" | tail -60 || true

      - name: Watch sources typecheck
        run: |
          set -e
          SDK=$(xcrun --sdk watchos --show-sdk-path)
          echo "watchOS SDK: $SDK"
          for f in targets/watch/*.swift; do
            echo "--- $f"
            xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64_32-apple-watchos11.0 "$f"
          done

      - name: Export ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          PROFILE_MAIN_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
          PROFILE_WIDGET_UUID: ${{ secrets.PROFILE_WIDGET_UUID }}
          PROFILE_WATCH_UUID: ${{ secrets.PROFILE_WATCH_UUID }}
          WATCH_PROFILE_SPEC: ${{ vars.VV_WATCH_PROFILE }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_MAIN_UUID</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$PROFILE_WIDGET_UUID</string>
              <key>$WATCH_BUNDLE_ID</key><string>$WATCH_PROFILE_SPEC</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/vv.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -50
          ls -l "$RUNNER_TEMP/ipa" || true

      - name: Verify ipa contents
        run: |
          set -x
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          unzip -l "$IPA" | grep -Ei 'appex|PlugIns' || true
          rm -rf "$RUNNER_TEMP/ipa-x" && mkdir -p "$RUNNER_TEMP/ipa-x"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-x"
          APP=$(find "$RUNNER_TEMP/ipa-x/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          plutil -p "$APP/Info.plist" | grep -Ei 'CFBundleVersion|CFBundleShortVersionString' || true
          echo "== UIScene gate =="
          plutil -p "$APP/Info.plist" > "$RUNNER_TEMP/plist.txt"
          grep -n "UIApplicationSceneManifest" "$RUNNER_TEMP/plist.txt" || { echo "FAIL: no scene manifest in signed ipa"; exit 1; }
          sed -n '/UIApplicationSceneManifest/,+12p' "$RUNNER_TEMP/plist.txt"
          grep -n "class SceneDelegate" ios/*/AppDelegate.swift || { echo "FAIL: SceneDelegate missing"; exit 1; }
          echo "OK: signed ipa adopts UIScene lifecycle"
          plutil -p "$APP/PlugIns/VehicleVaultWidget.appex/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|NSExtensionPointIdentifier' || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A3 'application-groups' || true
          codesign -d --entitlements :- "$APP/PlugIns/VehicleVaultWidget.appex" 2>/dev/null | grep -A3 'application-groups' || true
          codesign -dv "$APP/PlugIns/VehicleVaultWidget.appex" 2>&1 | grep -Ei 'Identifier|TeamIdentifier' | head -4 || true


          echo "== watch app gate =="
          WA="$APP/Watch/VehicleVaultWatch.app"
          test -d "$WA" || { echo "FAIL: watch app not embedded in the archive"; exit 1; }
          test -f "$WA/VehicleVaultWatch" || { echo "FAIL: watch app binary missing"; exit 1; }
          plutil -p "$WA/Info.plist" | grep -E 'CFBundleIdentifier|WKCompanionAppBundleIdentifier|CFBundleVersion' || true
          codesign -dv "$WA" 2>&1 | grep -Ei 'Identifier|TeamIdentifier' | head -4 || true
          echo "OK: watchOS app embedded and signed"

          echo "== app intents gate =="
          test -d "$APP/Metadata.appintents" || { echo "FAIL: no App Intents metadata in signed ipa"; exit 1; }
          ls -l "$APP/Metadata.appintents" || true
          for I in ServiceDueIntent FuelCostIntent; do
            grep -raq "$I" "$APP/Metadata.appintents" || { echo "FAIL: intent $I not compiled into metadata"; exit 1; }
          done
          strings -a "$APP/Metadata.appintents"/* | grep -o "[A-Za-z]*Intent" | sort -u | head -25 || true
          echo "OK: parameterized app intents compiled into the bundle"

          echo "== apple-fm gate =="
          test -f modules/apple-fm/ios/AppleFMModule.swift || { echo "FAIL: apple-fm module source missing"; exit 1; }
          test -f src/appleAi.js || { echo "FAIL: src/appleAi.js missing"; exit 1; }
          grep -q "appleAi" App.js || { echo "FAIL: App.js does not use the on-device bridge"; exit 1; }
          ls -l modules/apple-fm/ios || true
          BIN=$(basename "$APP" .app)
          strings -a "$APP/$BIN" 2>/dev/null | grep -c "AppleFMModule" || echo "WARN: AppleFMModule symbol not found in main binary"
          echo "== widget control gate =="
          WGX="$APP/PlugIns/VehicleVaultWidget.appex/VehicleVaultWidget"
          test -f "$WGX" || { echo "FAIL: widget extension binary missing from ipa"; exit 1; }
          strings -a "$WGX" 2>/dev/null | grep -c "NextServiceControl" || echo "WARN: control kind not found in widget binary"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
            --verbose 2>&1 | tail -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-release
          path: |
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
