name: shots

on:
  workflow_dispatch:

env:
  EXPO_PUBLIC_DEMO: '1'
  BUNDLE_ID: ${{ vars.VV_BUNDLE_ID }}

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build for simulator
        run: |
          set -e
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Capture per device
        run: |
          set -x
          RT=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[]|select(.isAvailable==true and (.name|startswith("iOS")))]|sort_by(.version|split(".")|map(tonumber))|last|.identifier')
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -name "*.app" | head -1)
          IPHONE_DT=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[]|select(.name=="iPhone 17 Pro Max")]|first|.identifier')
          IPAD_DT=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[]|select(.name|test("^iPad Pro 13-inch"))]|last|.identifier')
          echo "iPhone=$IPHONE_DT iPad=$IPAD_DT runtime=$RT"

          capture() {
            DT="$1"
            TAG="$2"
            UDID=$(xcrun simctl create "VVShot-$TAG" "$DT" "$RT")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            DOC=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents
            xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
            shot() {
              for i in $(seq 1 90); do
                if [ -f "$DOC/step_$1.txt" ]; then
                  sleep 1
                  xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/${TAG}_$2.png" || true
                  echo "captured $TAG $1"
                  return 0
                fi
                sleep 1
              done
              echo "TIMEOUT $TAG $1"
            }
            shot detail 02-detail
            shot record 03-record
            shot saved 04-saved
            shot garage2 01-garage
            shot settings 05-settings
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          }

          capture "$IPHONE_DT" iphone69
          capture "$IPAD_DT" ipad13
          for f in "$RUNNER_TEMP"/*.png; do
            echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr -d ' \n')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-shots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: warn
