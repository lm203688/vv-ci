name: homeshot

on:
  workflow_dispatch:

env:
  EXPO_PUBLIC_DEMO: '1'
  VV_BUNDLE_ID: ${{ vars.VV_BUNDLE_ID }}
  VV_WIDGET_BUNDLE_ID: ${{ vars.VV_WIDGET_BUNDLE_ID }}
  BUNDLE_ID: ${{ vars.VV_BUNDLE_ID }}
  APP_GROUP: ${{ vars.VV_APP_GROUP }}

jobs:
  homeshot:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Toolchain
        run: |
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build app for simulator (signed, so App Group entitlement applies)
        run: |
          set -e
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="-" 2>&1 | tail -30

      - name: Generate UI-test harness (home screen widget placement)
        run: |
          set -e
          brew install xcodegen >/dev/null 2>&1 || true
          H="$RUNNER_TEMP/harness"
          mkdir -p "$H/Host" "$H/UITests"
          cat > "$H/project.yml" <<'YAML'
          name: VVHomeShot
          options:
            bundleIdPrefix: com.example.vvshot
            deploymentTarget:
              iOS: "17.0"
          targets:
            Host:
              type: application
              platform: iOS
              sources: [Host]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.vvshot.host
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
            HostUITests:
              type: bundle.ui-testing
              platform: iOS
              sources: [UITests]
              dependencies:
                - target: Host
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.vvshot.host.uitests
                  GENERATE_INFOPLIST_FILE: YES
          schemes:
            VVHomeShot:
              build:
                targets:
                  Host: all
                  HostUITests: [test]
              test:
                targets:
                  - name: HostUITests
          YAML
          cat > "$H/Host/HostApp.swift" <<'SWIFT'
          import SwiftUI
          @main
          struct HostApp: App {
            var body: some Scene { WindowGroup { Text("host") } }
          }
          SWIFT
          cat > "$H/UITests/HomeShotTests.swift" <<'SWIFT'
          import XCTest
          
          final class HomeShotTests: XCTestCase {
            override func setUpWithError() throws {
              continueAfterFailure = true
            }
          
            func collect(_ n: XCUIElementSnapshot, _ t: XCUIElement.ElementType, _ out: inout [String]) {
              if n.elementType == t && !n.label.isEmpty { out.append(n.label) }
              for c in n.children { collect(c, t, &out) }
            }
          
            func count(_ n: XCUIElementSnapshot, _ t: XCUIElement.ElementType) -> Int {
              var c = (n.elementType == t) ? 1 : 0
              for ch in n.children { c += count(ch, t) }
              return c
            }
          
            func texts(_ sb: XCUIApplication) -> [String] {
              guard let snap = try? sb.snapshot() else { return [] }
              var out: [String] = []
              collect(snap, .staticText, &out)
              return out
            }
          
            func dump(_ sb: XCUIApplication, _ tag: String) {
              guard let snap = try? sb.snapshot() else { print("DUMP[\(tag)] NO SNAPSHOT"); return }
              var btns: [String] = []
              var tx: [String] = []
              collect(snap, .button, &btns)
              collect(snap, .staticText, &tx)
              print("DUMP[\(tag)] buttons=\(btns.count): " + btns.prefix(40).joined(separator: " | "))
              print("DUMP[\(tag)] texts=\(tx.count): " + tx.prefix(30).joined(separator: " | "))
              print("DUMP[\(tag)] search=\(count(snap, .searchField)) cells=\(count(snap, .cell))")
            }
          
            func tapLabel(_ sb: XCUIApplication, _ labels: [String], _ tag: String) -> Bool {
              for l in labels {
                let b = sb.buttons[l]
                if b.exists { if b.isHittable { b.tap() } else { b.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }; print("TAP \(tag) button=\(l)"); return true }
                let t = sb.staticTexts[l]
                if t.exists { if t.isHittable { t.tap() } else { t.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }; print("TAP \(tag) text=\(l)"); return true }
              }
              return false
            }
          
            func tapContaining(_ sb: XCUIApplication, _ needles: [String]) -> Bool {
              for n in needles {
                let btns = sb.buttons.allElementsBoundByIndex
                for e in btns where e.label.contains(n) {
                  if e.isHittable { e.tap() } else { e.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }
                  print("TAP button~\(n): [\(e.label)]")
                  return true
                }
                let cells = sb.cells.allElementsBoundByIndex
                for e in cells where e.label.contains(n) {
                  if e.isHittable { e.tap() } else { e.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.5)).tap() }
                  print("TAP cell~\(n): [\(e.label)]")
                  return true
                }
              }
              return false
            }
          
            func hasWidget(_ sb: XCUIApplication) -> Bool {
              let tx = texts(sb)
              for t in tx where t.contains("Next service") || t.contains("Daily Camry") || t.contains("days left") { return true }
              return false
            }
          
            func testAddWidget() throws {
              let sb = XCUIApplication(bundleIdentifier: "com.apple.springboard")
              sb.activate()
              XCTAssertTrue(sb.wait(for: .runningForeground, timeout: 10))
              sleep(4)
              dump(sb, "idle")
          
              sb.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.62)).press(forDuration: 1.8)
              sleep(3)
              dump(sb, "jiggle")
          
              if !tapLabel(sb, ["Edit", "编辑"], "edit") { print("NO EDIT BUTTON") }
              sleep(2)
              dump(sb, "editmenu")
          
              if !tapLabel(sb, ["Add Widget", "添加小组件", "Add widget"], "addwidget") { print("NO ADD WIDGET") }
              sleep(4)
              dump(sb, "gallery")
          
              let search = sb.searchFields.firstMatch
              if search.exists {
                search.tap()
                search.typeText("VehicleVault")
                sleep(3)
                print("TYPED VehicleVault")
              } else { print("NO SEARCH FIELD") }
              dump(sb, "byapp")
          
              var opened = tapContaining(sb, ["VehicleVault"])
              print("OPENED by app: \(opened)")
              sleep(3)
              dump(sb, "appdetail")
          
              if !opened {
                if search.exists { search.tap(); for _ in 0..<12 { search.typeText(XCUIKeyboardKey.delete.rawValue) }; search.typeText("Service"); sleep(3) }
                dump(sb, "byservice")
                opened = tapContaining(sb, ["Service", "Next service"])
                print("OPENED by service: \(opened)")
                sleep(3)
                dump(sb, "servicedetail")
              }
          
              if !tapLabel(sb, ["Add Widget", "添加小组件"], "confirm") {
                print("CONFIRM fallback")
                _ = tapContaining(sb, ["Add Widget"])
              }
              sleep(4)
              dump(sb, "added")
          
              if sb.buttons["Done"].exists { sb.buttons["Done"].tap(); sleep(3) }
              sb.coordinate(withNormalizedOffset: CGVector(dx: 0.5, dy: 0.97)).tap()
              sleep(4)
              dump(sb, "page1")
          
              var foundPage = 0
              if hasWidget(sb) { foundPage = 1; print("WIDGET PAGE 1") }
              if foundPage == 0 {
                for i in 1...4 {
                  sb.swipeLeft()
                  sleep(3)
                  dump(sb, "page\(i+1)")
                  if hasWidget(sb) { foundPage = i + 1; print("WIDGET PAGE \(foundPage)"); break }
                }
              }
              print("WIDGETFPAGE=\(foundPage)")
              sleep(2)
            }
          }
          
          
          SWIFT

          cd "$H" && xcodegen generate
          ls -la "$H"

      - name: Boot simulator, install and seed widget data
        run: |
          set -e
          RT=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[]|select(.isAvailable==true and (.name|startswith("iOS")))]|sort_by(.version|split(".")|map(tonumber))|last|.identifier')
          DT=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[]|select(.name=="iPhone 17 Pro Max")]|first|.identifier')
          UDID=$(xcrun simctl create VVHome "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "UDID=$UDID runtime=$RT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b || true
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          DOC=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents
          for i in $(seq 1 60); do [ -f "$DOC/step_widget1.txt" ] && break; sleep 1; done
          echo "--- widget marker"; cat "$DOC"/step_widget*.txt || echo "(none)"
          GROUP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" "$APP_GROUP" 2>/dev/null || true)
          echo "GROUP=$GROUP"
          [ -n "$GROUP" ] && plutil -p "$GROUP/Library/Preferences/$APP_GROUP.plist" || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2

      - name: Run springboard UI test (adds Service due widget)
        continue-on-error: true
        run: |
          H="$RUNNER_TEMP/harness"
          cd "$H"
          xcodebuild test \
            -project VVHomeShot.xcodeproj \
            -scheme VVHomeShot \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/hd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ui.log" 2>&1 || true
          echo "--- ui log size: $(wc -l < "$RUNNER_TEMP/ui.log")"
          grep -E 'DUMP\[|TAP |NO EDIT|NO ADD|NO SEARCH|NO RESULT|NO CONFIRM|TYPED' "$RUNNER_TEMP/ui.log" | tail -60

      - name: Capture home screen
        if: always()
        run: |
          sleep 3
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/home_widget.png" || true
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/home_widget_2.png" || true
          ls -la "$RUNNER_TEMP"/*.png || true
          python3 - <<'PY' || true
          from pathlib import Path
          import struct, sys
          for p in ["home_widget.png", "home_widget_2.png"]:
              f = Path("/Users/runner/work/_temp") / p
              if not f.exists():
                  continue
              data = f.read_bytes()
              w, h = struct.unpack(">II", data[16:24])
              print(p, "size", w, "x", h, "bytes", len(data))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-homeshot
          path: |
            ${{ runner.temp }}/home_widget*.png
            ${{ runner.temp }}/ui.log
          if-no-files-found: warn





